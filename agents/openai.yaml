interface:
  display_name: "Marie Writer"
  short_description: "以 Marie Wang 的观察和 Writing DNA 创作内容，并完成标题、保真润色与 B-roll 分析"
  default_prompt: "使用 $marie-writer 为 Marie Wang 撰写视频脚本。先按内容自身结构完成并锁定完整逐字稿，再按平台语域和 Writing DNA 校准；定稿后逐段分析 A-roll 或 B-roll，只对选中的 B-roll 片段单独策划画面与对应旁白。不要预设文章结构或 A/B 比例，不编客户、亲历、对白或现场细节。"
